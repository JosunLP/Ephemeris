[workspace]
members = ["crates/core"]

[package]
name = "tpmplaner"
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A desktop widget showing today's calendar events and due tasks"
repository = "https://github.com/JosunLP/TPMPlaner"
readme = "README.md"
rust-version = "1.90"

[dependencies]
tpmplaner-core = { path = "crates/core" }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# `win-system-proxy` picks the proxy settings up from the Windows internet
# options — without it every request fails on a network that only gets out
# through a corporate proxy.
ureq = { version = "3.3.0", default-features = false, features = [
    "rustls",
    "json",
    "win-system-proxy",
] }

# Trimmed for a small binary and a low idle footprint.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The locale back end on Linux goes through the C library — `newlocale`,
# `nl_langinfo`, `strftime` — and `struct tm`'s layout and the `nl_item`
# constants differ between C libraries and architectures. `libc` has them right
# for every target; writing them out by hand would be guessing at a structure
# that `strftime` writes through.
#
# macOS is deliberately not in this list: it uses Core Foundation, which is a
# plain C API declared inline, so it needs no crate at all.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2.189"

# The Win32 bindings are only ever used by `src/win`, which is itself behind
# `#[cfg(windows)]`. Declaring them per target keeps them off the macOS and
# Linux builds entirely rather than compiling a crate that resolves to nothing
# there.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
windows-numerics = "0.3.1"
