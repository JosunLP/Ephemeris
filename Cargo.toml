[package]
name = "tpmplaner"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A desktop widget showing today's calendar events and due tasks"
repository = "https://github.com/JosunLP/TPMPlaner"
readme = "README.md"
rust-version = "1.90"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# `win-system-proxy` uebernimmt die Proxy-Einstellungen aus den
# Windows-Internetoptionen — ohne das schlaegt jeder Abruf in Netzen fehl,
# die nur ueber einen Unternehmensproxy hinauskommen.
ureq = { version = "3.3.0", default-features = false, features = [
    "rustls",
    "json",
    "win-system-proxy",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
windows-numerics = "0.3.1"

# Auf kleine Binaergroesse und niedrigen Idle-Footprint getrimmt.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
