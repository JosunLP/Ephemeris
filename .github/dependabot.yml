version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The windows crate moves fast and its releases regularly rename APIs;
    # grouping keeps those upgrades in one reviewable pull request.
    groups:
      windows:
        patterns:
          - windows
          - windows-*
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflows pin actions to commit SHAs, which means a fix upstream only
  # reaches this repository when Dependabot rewrites the pin — monthly is too
  # slow a floor for that. Grouped, because bumping five pins is one review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # The documentation site has its own lockfile, and `npm ci` builds strictly
  # from it — so nothing there updates unless Dependabot proposes it.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docs:
        patterns:
          - "*"
