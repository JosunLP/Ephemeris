# SPDX-License-Identifier: GPL-3.0-or-later
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Only what GitHub Pages needs, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deployment should not cancel one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # VitePress reads the git history for "last updated" stamps.
          fetch-depth: 0

      # `cache` and `cache-dependency-path` are set explicitly rather than
      # relying on the automatic package-manager detection that v5 introduced,
      # so the cache key stays tied to the lockfile this build actually uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `npm ci` installs exactly what the lockfile pins and fails if the
      # lockfile and package.json have drifted apart. `npm install` would
      # silently resolve new versions, so a docs build could differ from the
      # one that was reviewed.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Since v4 this action drops hidden files from the artifact. The current
      # VitePress output contains none, but anything dot-prefixed added to the
      # build (a `public/.well-known`, say) would silently not be deployed —
      # `include-hidden-files: true` is the escape hatch if that day comes.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
