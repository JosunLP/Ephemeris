# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tpmplaner.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: tpmplaner.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The installer verifies this before putting anything on disk, so a
      # truncated download or a tampered asset cannot be installed silently.
      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "tpmplaner-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name.exe"
          $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Set-Content "dist/$name.exe.sha256" -Encoding ascii
          Write-Host "$name.exe  $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The install script is fetched straight from the release, so it is
      # pinned to the same version as the binary it installs.
      - name: Collect assets
        run: |
          cp scripts/install.ps1 artifacts/
          cp scripts/uninstall.ps1 artifacts/
          ls -l artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
