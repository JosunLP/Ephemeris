# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

# Read-only by default. Only the job that actually publishes gets write
# access, so a compromised build step cannot touch the release.
permissions:
  contents: read

# Two runs for the same tag would race for the same release. Never cancel a
# publish that is already under way.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ephemeris.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: ephemeris.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Publishing a "v1.0.1" release built from a tree that still says 1.0.0
      # would ship a binary whose own update check disagrees with the release
      # it came from. Cheap to verify, expensive to discover afterwards.
      - name: Verify tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $manifest = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($manifest.packages | Where-Object name -eq ephemeris).version
          if ($tag -ne $version) {
            throw "Tag '$tag' does not match Cargo.toml version '$version'"
          }
          Write-Host "Tag and Cargo.toml agree on $version"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # The installer verifies this before putting anything on disk, so a
      # truncated download or a tampered asset cannot be installed silently.
      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "ephemeris-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name.exe"
          $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Set-Content "dist/$name.exe.sha256" -Encoding ascii
          Write-Host "$name.exe  $hash"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # macOS and Linux ship a tarball rather than an installer. There is no
  # equivalent of the `install.ps1` one-liner on either, and inventing one that
  # writes outside the package manager's view would make the widget a worse
  # citizen than having none — the reasoning is in
  # `docs/development/porting.md`. So: one archive per target, a checksum
  # beside it, and `tar -xzf` as the documented install.
  #
  # macOS is built twice rather than as a universal binary. `lipo` would halve
  # the number of assets and double the size of each, and the download page can
  # say "Apple silicon" and "Intel" perfectly well.
  build-unix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag matches Cargo.toml
        # Through the environment rather than into the script text: a
        # `workflow_dispatch` input expanded inline would be shell code in this
        # job. It is only ever compared against a version string.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          tag="${tag#v}"
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ephemeris"))')
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match Cargo.toml version '$version'" >&2
            exit 1
          fi
          echo "Tag and Cargo.toml agree on $version"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # macOS also gets an application bundle. It is *not* signed or notarised
      # — that needs a paid developer account this repository does not have —
      # so Gatekeeper will refuse it on first launch until the user right-
      # clicks and chooses Open. The bundle is still worth shipping: it is
      # what puts the widget in Applications, gives it an identifier, and
      # makes `LSUIElement` true from the very first frame rather than from
      # whenever the program's own code runs.
      - name: Build the application bundle
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app="dist/Ephemeris.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ephemeris" "$app/Contents/MacOS/"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist \
            > "$app/Contents/Info.plist"
          cp LICENSE README.md "$app/Contents/Resources/"
          # Under the name `CFBundleIconFile` gives. The container is built
          # from the SVG by `scripts/render-logo.py` and committed, so no
          # rendering happens on the runner and `iconutil` is not needed.
          cp assets/logo.icns "$app/Contents/Resources/Ephemeris.icns"

      # The archive carries the licence and the readme beside the binary,
      # because a tarball is all a distribution packager or a curious user
      # gets — there is no installer to point them anywhere else.
      - name: Package and checksum
        run: |
          name="ephemeris-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ephemeris" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          if [ -d dist/Ephemeris.app ]; then
            cp -R dist/Ephemeris.app "dist/$name/"
            rm -rf dist/Ephemeris.app
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/io.github.josunlp.ephemeris.desktop "dist/$name/"
            # Beside it, under the name its `Icon=` names, so whoever installs
            # the one has the other in the form `hicolor/scalable/apps` wants.
            cp assets/logo.svg "dist/$name/io.github.josunlp.ephemeris.svg"
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          cd dist
          # `shasum` on macOS, `sha256sum` on Linux; both write the format the
          # verification step reads back.
          if command -v sha256sum > /dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only place in either workflow that may write to the repository.
    permissions:
      contents: write
    steps:
      # Checking out the tag rather than the default branch is what makes the
      # comment below true: on a manual dispatch `github.ref` is the branch
      # the run was started from, so without this the install script would be
      # taken from main instead of from the released tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # v8 fails the run on a digest mismatch instead of only warning, which
      # is the same guarantee the checksum step below re-establishes for the
      # published files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      # Re-check every checksum after the upload/download round trip, so the
      # file the installer verifies against is known to match the binary that
      # was actually built.
      - name: Verify checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sums=(*.sha256)
          if [ ${#sums[@]} -eq 0 ]; then
            echo "No checksum files found in artifacts" >&2
            exit 1
          fi
          for f in "${sums[@]}"; do
            sha256sum --check "$f"
          done

      # The install script is fetched straight from the release, so it is
      # pinned to the same version as the binary it installs.
      - name: Collect assets
        run: |
          cp scripts/install.ps1 artifacts/
          cp scripts/uninstall.ps1 artifacts/
          ls -l artifacts

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # CI already runs this against the scripts in the tree. This runs it against
  # what is actually attached to the release, on both architectures, which is
  # the only way to catch an asset that was built or uploaded wrongly.
  #
  # It necessarily runs after publishing: the failure it guards against is
  # GitHub serving the assets as `application/octet-stream`, which cannot be
  # reproduced before they are assets. So it cannot block a bad release, only
  # report one loudly enough to pull -- which is still the difference between
  # finding out here and finding out from a user.
  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Pinned to the tag rather than `latest`: a release published as a
      # pre-release, or a concurrent run, would otherwise leave it testing a
      # different version than the one this run built.
      - name: Install from the published release, verify and uninstall
        shell: powershell
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          .github/scripts/smoke-install.ps1 `
            -InstallScript "$base/install.ps1" `
            -UninstallScript "$base/uninstall.ps1" `
            -Version $env:TAG `
            -Repo "${{ github.repository }}"
