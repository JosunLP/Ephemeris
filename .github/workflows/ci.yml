# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI, but keep local builds comfortable.
  RUSTFLAGS: -D warnings

# Every job below is independent — there is no `needs:` anywhere in this
# workflow, so all of them start at once and the run takes as long as its
# slowest job rather than the sum of all of them.
jobs:
  # Formatting is a parser-level check, so it does not need Windows and it
  # does not need a build cache. It finishes in seconds and gives the fastest
  # possible "your diff is not formatted" signal.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The portable core must build and pass its tests on the non-Windows
  # systems too. This is what keeps the boundary honest: a stray platform call
  # in `tpmplaner-core` fails here rather than on somebody's laptop months
  # later. Windows is left out on purpose — the `check` job already compiles
  # and tests the core there as part of `--workspace`.
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p tpmplaner-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p tpmplaner-core

  check:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  # Split out from `check` rather than appended to it: the release profile
  # (`lto = "fat"`, `codegen-units = 1`) shares no build artifacts with the
  # debug profile the tests use, so running it as a separate job costs no
  # extra compilation but takes the slowest step off the critical path.
  #
  # The unit tests cover the platform-independent logic. The parts that need a
  # real GPU device and a window (renderer, hit testing) are only exercised by
  # building — a broken Direct2D call is a compile error, not something a
  # headless runner could observe.
  build:
    name: Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tpmplaner-windows-x86_64
          path: target/release/tpmplaner.exe
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `cargo install cargo-audit` compiles the tool from source on every
      # run — several minutes of runner time for a check that only reads
      # `Cargo.lock`. This pulls a prebuilt binary instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # A known-vulnerable dependency in a program that holds an OAuth refresh
      # token is worth failing the build over.
      - name: Audit
        run: cargo audit --deny warnings
