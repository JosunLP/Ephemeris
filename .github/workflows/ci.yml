# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing in this workflow writes to the repository. Without
# this block the jobs inherit whatever the repository default happens to be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded push to a branch makes the previous run pointless, but on
  # main every commit keeps its own run — the uploaded binary and the audit
  # verdict stay attributable to a specific commit that way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Every job below is independent — there is no `needs:` anywhere in this
# workflow, so all of them start at once and a run takes as long as its
# slowest job rather than the sum of all of them.
#
# Third-party actions are pinned to a commit SHA rather than a tag: a tag can
# be moved to point at new code, and any action in this workflow runs with
# access to the job's token. Dependabot bumps the pins together with the
# version comment.
jobs:
  # Formatting is a parser-level check, so it does not need Windows and it
  # does not need a build cache. It finishes in seconds and gives the fastest
  # possible "your diff is not formatted" signal.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

      # A Flatpak build has no network, so every crate is listed as a source
      # with the checksum `Cargo.lock` already carries. That list is generated,
      # which means it can go stale — silently, and only discovered by whoever
      # next tries to build the Flatpak. The generator needs nothing but the
      # lock file, so checking it costs a second here.
      - name: Flatpak crate sources are in step with Cargo.lock
        run: python3 packaging/linux/cargo-sources.py --check

      # The same argument for the logo. `assets/logo.svg` is the only drawn
      # file and everything else is generated from it by
      # `scripts/render-logo.py` — including `assets/logo.ico`, which `build.rs`
      # embeds into the Windows executable, so a stale one is a build input
      # that disagrees with its source rather than only a wrong picture.
      #
      # `--verify` rather than `--check`: the latter re-renders and compares
      # bytes, and those depend on the CairoSVG and Cairo versions the runner
      # happens to have, so it would eventually fail on an upgrade rather than
      # on a stale file. This needs no renderer and checks what cannot go
      # flaky — that the copied SVG is byte-identical, and that every generated
      # container is present and structurally what the script writes.
      - name: Generated logo files are in step with the SVG
        run: python3 scripts/render-logo.py --verify

  # The portable core must build and pass its tests on the non-Windows
  # systems too. This is what keeps the boundary honest: a stray platform call
  # in `ephemeris-core` fails here rather than on somebody's laptop months
  # later. Windows is left out on purpose — the `check` job already compiles
  # and tests the core there as part of `--workspace`.
  #
  # Since the platform split the whole binary builds here as well, so this job
  # also links `src/unix` and runs it. "The core is portable" was previously a
  # claim about a crate that compiles; the smoke step makes it a claim about a
  # program that runs, on both systems, with the settings, the locale, the
  # model and the palette all exercised end to end.
  core:
    name: Core and Unix front end on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The locale back end asks the C library for the user's own date and time
      # patterns, and a stock Ubuntu image has generated almost none of them:
      # `newlocale` fails, the back end reports it has no answer, and the tests
      # that check what the platform returns would skip rather than run. So the
      # locales they use are generated first, and the environment variable in
      # the test step turns "no such locale" from a skip back into a failure.
      #
      # macOS needs nothing here. Core Foundation carries the CLDR data itself
      # and does not care what the system has installed.
      - name: Generate the locales the date tests need
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8 en_US.UTF-8
          locale -a | sort

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # `EPHEMERIS_REQUIRE_SYSTEM_LOCALE` makes the date and time cases in
      # `src/unix/locale.rs` insist on a real answer from the platform. Without
      # it they pass on a machine that has no `de_DE.UTF-8`, which is right for
      # a laptop and useless as a signal here.
      - name: Tests
        env:
          EPHEMERIS_REQUIRE_SYSTEM_LOCALE: "1"
        run: cargo test --locked --workspace --all-targets

      # Demo mode needs no account and reaches no network, which is what makes
      # it usable as a smoke test. The output is checked rather than merely the
      # exit status: a front end that prints nothing at all would otherwise
      # pass.
      #
      # The locale is pinned for the same reason the second step pins one: the
      # strings below are the English catalogue, and which catalogue the widget
      # loads is decided by the runner's own environment. A runner image that
      # exports a German or French locale would fail this step with nothing
      # wrong in the product. All three variables, because
      # `PortableLocale::user_default_tag` reads them in turn and moves on from
      # any that is unset or "C".
      - name: Smoke test the printed agenda
        env:
          EPHEMERIS_DEMO: "1"
          # The macOS runner has a window server, so the front end would open
          # the widget and never return. This step is about the portable half,
          # and the variable is what asks for that half by name.
          EPHEMERIS_TEXT: "1"
          LC_ALL: en_US.UTF-8
          LC_TIME: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          cargo run --locked --quiet > agenda.txt
          cat agenda.txt
          grep -q "SCHEDULE" agenda.txt
          grep -q "TASKS" agenda.txt

      # Two mechanisms now, where this used to prove one. Which catalogue the
      # interface text comes from is the first. The second is the date, which
      # since `install_host` gained a real `LocaleBackend` comes from Core
      # Foundation on macOS and the C library on Linux: the first line of the
      # output is the weekday, and in French it is one of exactly seven words.
      # `PortableLocale` would have written `Tuesday` there.
      #
      # The weekday rather than the month, because this runs every day of the
      # year: the month name in the output is whatever month it is today, and
      # asserting one would make the build fail on the first of a month. The
      # unit cases in `src/unix/locale.rs` pin a fixed date and check the month
      # names there. What this step adds is that the whole program, started the
      # way a user starts it, picks the locale up from the environment and
      # carries it to the printed line.
      #
      # `TÂCHES` rather than only `AGENDA`: `AGENDA` is `section_events` in
      # French, Spanish, Italian, both Portuguese catalogues and Dutch, so on
      # its own it proves "not English". `TÂCHES` is French and nothing else.
      #
      # `LC_ALL` rather than `LANG`: it is the variable that outranks the rest,
      # and it is the first one `PortableLocale::user_default_tag` reads — so
      # the test says what locale it wants rather than hoping the runner has
      # not already said something else. Setting only `LANG` failed on the
      # macOS runner for exactly that reason.
      #
      # Written to a file rather than piped into `grep -q`, which would close
      # the pipe on its first match and leave the program writing into it.
      - name: Smoke test a second language
        env:
          EPHEMERIS_DEMO: "1"
          EPHEMERIS_TEXT: "1"
          LC_ALL: fr_FR.UTF-8
          LC_TIME: fr_FR.UTF-8
          LANG: fr_FR.UTF-8
        run: |
          cargo run --locked --quiet > agenda-fr.txt
          cat agenda-fr.txt
          grep -q "AGENDA" agenda-fr.txt
          grep -q "TÂCHES" agenda-fr.txt
          grep -Eq '^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche),' agenda-fr.txt

      # The window itself, on a virtual X server. This is what stops the Linux
      # front end from rotting: `dlopen` failures, a wrong Xlib signature, a
      # missing Pango symbol and a panic in the first frame are all invisible
      # to a compiler and all fatal here.
      #
      # `xvfb-run` gives a 24-bit screen with no compositing manager, which is
      # deliberately the *worse* of the two cases: the widget has to fall back
      # to the default visual and draw opaque. A run that needed a 32-bit
      # visual would pass on a desktop and fail here, which is the wrong way
      # round for a smoke test.
      #
      # The widget never exits by itself, so it is stopped after a few seconds
      # and judged by its log — the same file a bug report is asked for. An
      # `ERROR` line anywhere in it fails the step.
      - name: Smoke test the window
        if: runner.os == 'Linux'
        env:
          EPHEMERIS_DEMO: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          sudo apt-get update
          # `libglib2.0-0` for `g_object_unref`: Pango depends on it, but
          # naming it makes the list match what `Libs::load` actually opens.
          sudo apt-get install -y --no-install-recommends             xvfb libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libglib2.0-0
          cargo build --locked
          log="$HOME/.config/ephemeris/ephemeris.log"
          rm -f "$log"
          xvfb-run -a --server-args='-screen 0 1280x1024x24'             timeout --signal=TERM 15 ./target/debug/ephemeris || true
          echo '--- log ---'
          cat "$log"
          grep -q "Start — locale" "$log"
          grep -q "X11 session" "$log"
          # The level column, not the word: an error message that happens to
          # contain "ERROR" is not the same as a line logged at that level.
          if grep -qE '^[0-9-]+ [0-9:]+ ERROR ' "$log"; then
            echo 'The widget logged an error while starting.'
            exit 1
          fi

      # And the Wayland back end, against a compositor that really implements
      # `wlr-layer-shell` — which is the whole reason that back end exists and
      # the half no compiler can check. Sway is wlroots, and its headless
      # backend needs no seat, no graphics card and no session.
      #
      # The two are separate steps rather than one parameterised job because
      # they fail differently: an X11 failure is Xlib or the EWMH hints, a
      # Wayland one is a protocol table or a buffer, and a run that says which
      # is worth more than one that says "the widget did not start".
      - name: Smoke test the Wayland window
        if: runner.os == 'Linux'
        env:
          EPHEMERIS_DEMO: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          sudo apt-get install -y --no-install-recommends sway
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # A compositor with no session, no input devices and no graphics
          # card: `headless` invents an output, `pixman` renders on the CPU —
          # a runner has no `/dev/dri` for the GLES renderer to open — and an
          # empty configuration keeps sway from looking for one.
          export WLR_BACKENDS=headless
          export WLR_HEADLESS_OUTPUTS=1
          export WLR_RENDERER=pixman
          export WLR_LIBINPUT_NO_DEVICES=1
          sway --config /dev/null > "$RUNNER_TEMP/sway.log" 2>&1 &

          # The socket's name is sway's to choose, so it is discovered rather
          # than assumed.
          socket=
          for _ in $(seq 1 40); do
            socket=$(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep -m1 '^wayland-[0-9]*$' || true)
            [ -n "$socket" ] && break
            sleep 0.5
          done
          if [ -z "$socket" ]; then
            echo 'Sway did not come up; the Wayland back end cannot be tested.'
            cat "$RUNNER_TEMP/sway.log"
            exit 1
          fi
          echo "compositor socket: $socket"

          log="$HOME/.config/ephemeris/ephemeris.log"
          rm -f "$log"
          # `DISPLAY` cleared as well, so a failure to speak Wayland cannot be
          # hidden by the X11 back end quietly taking over.
          env -u DISPLAY WAYLAND_DISPLAY="$socket" \
            timeout --signal=TERM 15 ./target/debug/ephemeris || true
          pkill -x sway || true

          echo '--- log ---'
          cat "$log"
          # The line that proves the layer shell was found *and used*. Without
          # it the widget fell back to an ordinary window, and on a wlroots
          # compositor that means a wrong protocol table rather than a missing
          # protocol.
          grep -q "wlr-layer-shell" "$log"
          grep -q "bottom layer" "$log"
          if grep -qE '^[0-9-]+ [0-9:]+ ERROR ' "$log"; then
            echo 'The widget logged an error while starting.'
            exit 1
          fi

  check:
    name: Lint and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Clippy runs rustc's own lint set as well, so denying warnings here
      # covers plain compiler warnings across the whole workspace.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-targets

  # Split out from `check` rather than appended to it: the release profile
  # (`lto = "fat"`, `codegen-units = 1`) shares no build artifacts with the
  # debug profile the tests use, so running it as a separate job costs no
  # extra compilation but takes the slowest step off the critical path.
  #
  # The unit tests cover the platform-independent logic. The parts that need a
  # real GPU device and a window (renderer, hit testing) are only exercised by
  # building — a broken Direct2D call is a compile error, not something a
  # headless runner could observe.
  build:
    name: Release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --release

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ephemeris-windows-x86_64
          path: target/release/ephemeris.exe
          if-no-files-found: error

  # The same release profile on the two platforms the port added, and for the
  # same reason it exists on Windows: `lto = "fat"` and `codegen-units = 1`
  # share nothing with the debug profile, and a release-only compile error is
  # a real thing. The size is printed because "~1.7 MB, single file" is a
  # claim this project makes in its README.
  build-unix:
    name: Release build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefact: ephemeris-linux-x86_64
          - os: macos-latest
            artefact: ephemeris-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --release

      - name: Report the size
        run: ls -l target/release/ephemeris

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artefact }}
          path: target/release/ephemeris
          if-no-files-found: error

  # The installer is the first thing a user runs and the only part of the
  # project that no Rust test touches. v1.0.0 shipped one that rejected its own
  # intact release as a checksum mismatch, because the bug only appears against
  # a real HTTP response from GitHub's asset host. Hence a job that installs
  # for real rather than a unit test with a mocked download.
  scripts:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # These scripts are read as the system ANSI codepage by Windows
      # PowerShell 5.1 (they carry no BOM) and are also piped straight from an
      # HTTP response with no charset into `iex`. Non-ASCII survives neither
      # path, so a stray typographic dash reaches the user as mojibake.
      - name: Check for non-ASCII characters
        shell: pwsh
        run: |
          $bad = Get-ChildItem scripts/*.ps1, .github/scripts/*.ps1 | Where-Object {
            (Get-Content -Raw -LiteralPath $_.FullName) -cmatch '[^\x00-\x7F]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "non-ASCII in $($_.Name)" }
            exit 1
          }
          Write-Host 'All scripts are pure ASCII.'

      # `Write-Host` is excluded on purpose: these scripts talk to a person at
      # a console, which is the one case the rule is not about.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path scripts -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $found += Invoke-ScriptAnalyzer -Path .github/scripts -Recurse -ExcludeRule PSAvoidUsingWriteHost
          if ($found) {
            $found | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
            exit 1
          }
          Write-Host 'No findings.'

      # Installs the scripts from this branch, but pulls the binary from the
      # latest published release -- the installer's job is fetching and
      # verifying a released asset, so there has to be a real one to fetch.
      #
      # Run twice, because the two PowerShell editions are not interchangeable
      # here and the bug this guards against behaved differently in each:
      # `Invoke-WebRequest.Content` on an octet-stream asset gave an empty
      # string on 5.1 and a Byte[] on 7. `shell: powershell` is Windows
      # PowerShell 5.1, which is what a user gets out of the box.
      - name: Install, verify and uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .github/scripts/smoke-install.ps1 `
            -InstallScript scripts/install.ps1 `
            -UninstallScript scripts/uninstall.ps1

      - name: Install, verify and uninstall (PowerShell 7)
        shell: pwsh
        run: |
          .github/scripts/smoke-install.ps1 `
            -InstallScript scripts/install.ps1 `
            -UninstallScript scripts/uninstall.ps1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # `cargo install cargo-audit` compiles the tool from source on every
      # run — measured at 5m24s, against 4s for the check itself. This pulls a
      # prebuilt binary instead.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit
      # A known-vulnerable dependency in a program that holds an OAuth refresh
      # token is worth failing the build over.
      - name: Audit
        run: cargo audit --deny warnings
