# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI, but keep local builds comfortable.
  RUSTFLAGS: -D warnings

jobs:
  # The portable core must build and pass its tests on all three systems.
  # This is what keeps the boundary honest: a stray platform call in
  # `tpmplaner-core` fails here rather than on somebody's laptop months later.
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p tpmplaner-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p tpmplaner-core

  check:
    name: Format, lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      # The unit tests cover the platform-independent logic. The parts that
      # need a real GPU device and a window (renderer, hit testing) are only
      # exercised by building — a broken Direct2D call is a compile error, not
      # something a headless runner could observe.
      - name: Release build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tpmplaner-windows-x86_64
          path: target/release/tpmplaner.exe
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # A known-vulnerable dependency in a program that holds an OAuth refresh
      # token is worth failing the build over.
      - name: Audit
        run: cargo audit --deny warnings
