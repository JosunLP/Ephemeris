#
# Flatpak manifest for Ephemeris.
#
# Build and install locally with:
#
#     flatpak-builder --user --install --force-clean build \
#         packaging/linux/io.github.josunlp.ephemeris.yml
#
# Flathub runs two further checks on every build, and both can be run here
# first. `org.flatpak.Builder` carries the linter, so it is the build to use
# before a submission rather than the one above:
#
#     flatpak run org.flatpak.Builder --user --install --force-clean \
#         --install-deps-from=flathub --repo=repo build \
#         packaging/linux/io.github.josunlp.ephemeris.yml
#     flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
#         manifest packaging/linux/io.github.josunlp.ephemeris.yml
#     flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
#
# The runtime already carries everything the widget opens at run time — Xlib,
# Cairo, Pango and libwayland all come with the freedesktop platform — so this
# builds one binary and nothing else.
app-id: io.github.josunlp.ephemeris
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ephemeris

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/ephemeris/cargo

finish-args:
  # The widget draws on the desktop, so it needs the display it is on —
  # whichever that is. `fallback-x11` rather than `x11`: under a Wayland
  # session the native back end is used and the X socket is never opened.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Google, Microsoft and CalDAV are all remote, and the sign-in flow listens
  # on a loopback port for the callback.
  - --share=network

  # The refresh token goes to the Secret Service rather than to a file. Without
  # this the widget still runs and says in its log that it is storing the token
  # unencrypted, which is a worse trade than asking for the permission.
  - --talk-name=org.freedesktop.secrets

  # Light and dark, and the accent colour, through the settings portal. The
  # portal is reached through the sandbox by default; naming it here is what
  # lets `gdbus monitor` watch it for changes.
  - --talk-name=org.freedesktop.portal.Desktop

  # "Open log", "Open data folder" and clicking an event all hand a path or a
  # URL to the desktop rather than opening anything themselves.
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: ephemeris
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/ephemeris /app/bin/ephemeris
      - install -Dm644 packaging/linux/io.github.josunlp.ephemeris.desktop
        /app/share/applications/io.github.josunlp.ephemeris.desktop
      - install -Dm644 packaging/linux/io.github.josunlp.ephemeris.metainfo.xml
        /app/share/metainfo/io.github.josunlp.ephemeris.metainfo.xml
      # What the `.desktop` file's `Icon=` has been naming all along. The
      # scalable directory is enough on its own: the name matches the app ID,
      # which is what Flathub checks for.
      - install -Dm644 assets/logo.svg
        /app/share/icons/hicolor/scalable/apps/io.github.josunlp.ephemeris.svg
    sources:
      - type: dir
        path: ../..
        # A directory source is copied wholesale, and a checkout that has been
        # built in carries a `target` far larger than everything else here put
        # together. Cargo would rebuild it anyway: the sandbox compiles with
        # the SDK's toolchain, under paths the host's fingerprints do not
        # match.
        skip:
          - target
      # One source entry per crate, so the build stays offline and every
      # download is verified against the checksum `Cargo.lock` already holds.
      # Generated by `packaging/linux/cargo-sources.py`; continuous
      # integration fails if it has gone out of step with the lock file.
      - cargo-sources.json
